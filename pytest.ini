[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: no database and no pipeline outputs needed (every test not marked integration or data)
    integration: needs FalkorDB running (deploy/falkordb.ps1 start); skipped when it is not reachable
    data: needs IBM's files and the pipeline's outputs in work/; skipped when they are missing
addopts = -ra -p no:cacheprovider
